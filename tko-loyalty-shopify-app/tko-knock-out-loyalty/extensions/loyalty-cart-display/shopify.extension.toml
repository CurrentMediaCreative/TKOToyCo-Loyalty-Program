api_version = "2025-04"

[[extensions]]
type = "theme_app_extension"
name = "TKO Loyalty Cart Display"
handle = "loyalty-cart-display"

[extensions.settings]
[[extensions.settings.fields]]
key = "title"
type = "text"
name = "Title"
description = "The title of the loyalty points display"
default = "Your Loyalty Status"

[[extensions.settings.fields]]
key = "show_breakdown"
type = "checkbox"
name = "Show Points Breakdown"
description = "Show detailed breakdown of spend and bonus points"
default = true

[[extensions.settings.fields]]
key = "show_tier"
type = "checkbox"
name = "Show Tier Information"
description = "Display customer's current tier"
default = true

[[extensions.settings.fields]]
key = "show_points_to_earn"
type = "checkbox"
name = "Show Points to Earn"
description = "Show how many points customer will earn from current cart"
default = true
