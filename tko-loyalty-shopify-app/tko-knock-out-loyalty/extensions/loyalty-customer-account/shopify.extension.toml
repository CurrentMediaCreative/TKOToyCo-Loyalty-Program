# Learn more about configuring your customer account UI extension:
# https://shopify.dev/docs/api/customer-account-ui-extensions

api_version = "2025-07"

[[extensions]]
type = "ui_extension"
name = "loyalty-customer-account"
handle = "loyalty-customer-account"

[[extensions.targeting]]
target = "customer-account.order-status.block.render"
module = "./src/CustomerAccount.tsx"

[extensions.capabilities]
api_access = true
block_progress = false

[[extensions.metafields]]
namespace = "tko_loyalty"
key = "tier_name"

[[extensions.metafields]]
namespace = "tko_loyalty"
key = "tier_level"

[[extensions.metafields]]
namespace = "tko_loyalty"
key = "total_spend"

[[extensions.metafields]]
namespace = "tko_loyalty"
key = "spend_points"

[[extensions.metafields]]
namespace = "tko_loyalty"
key = "bonus_points"

[[extensions.metafields]]
namespace = "tko_loyalty"
key = "total_points"

[[extensions.metafields]]
namespace = "tko_loyalty"
key = "tier_benefits"

[extensions.settings]
[[extensions.settings.fields]]
key = "title"
type = "single_line_text_field"
name = "Title"
description = "The title displayed in the loyalty card"

[[extensions.settings.fields]]
key = "show_tier_progress"
type = "boolean"
name = "Show Tier Progress"
description = "Display progress towards next tier"

[[extensions.settings.fields]]
key = "show_unfulfilled_points"
type = "boolean"
name = "Show Unfulfilled Points"
description = "Display points from pending orders"
